name: Build installers

# Läuft, wenn ein Tag wie v1.0.0 gepusht wird (oder von Hand gestartet wird),
# baut Papiermond für Linux, Windows und macOS und hängt die Dateien an ein GitHub-Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Papiermond-linux.tar.gz
          - os: windows-latest
            artifact: Papiermond-windows.zip
          - os: macos-latest
            artifact: Papiermond-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Linux bauen und packen
        if: runner.os == 'Linux'
        run: |
          flutter build linux --release
          tar -C build/linux/x64/release/bundle -czf ${{ matrix.artifact }} .

      - name: Windows bauen und packen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          flutter build windows --release
          $out = 'build/windows/x64/runner/Release'
          # Visual-C++-Laufzeit beilegen, damit die App ohne Zusatzinstallation startet.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $out
          }
          Compress-Archive -Path "$out/*" -DestinationPath ${{ matrix.artifact }}

      - name: macOS bauen und packen
        if: runner.os == 'macOS'
        run: |
          flutter build macos --release
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Papiermond.app" ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
